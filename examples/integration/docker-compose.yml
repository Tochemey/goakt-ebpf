include:
  - path: .signoz/deploy/docker/.goakt-compose.yaml

services:
  goakt-app:
    container_name: signoz-integration-app
    build:
      context: .
      dockerfile: Dockerfile.app
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: integration-app
      HTTP_PORT: 8081
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - goakt-ebpf-net
    stdin_open: true
    tty: true

  goakt-ebpf:
    init: true
    build:
      context: ../..
      dockerfile: Dockerfile
    privileged: true
    user: root
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: goakt-ebpf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - goakt-app
    pid: "container:signoz-integration-app"
    networks:
      - goakt-ebpf-net
    entrypoint:
      ["/bin/sh", "-c", "sleep 3 && exec /usr/local/bin/goakt-ebpf -pid 1"]

  # Local demo credentials for the self-hosted SigNoz instance.
  # SigNoz enforces: >=12 chars with upper, lower, digit, and symbol.
  # Do not reuse this password outside this integration environment.
  signoz:
    environment:
      SIGNOZ_USER_ROOT_ENABLED: "true"
      SIGNOZ_USER_ROOT_EMAIL: admin@goakt.local
      SIGNOZ_USER_ROOT_PASSWORD: GoAkt-eBPF-2026!
      SIGNOZ_USER_ROOT_ORG_NAME: default

networks:
  goakt-ebpf-net:
    driver: bridge
